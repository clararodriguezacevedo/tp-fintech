# Manual backup only: the schedule runs in Supabase pg_cron.
# Fill queued paper trades and check stop loss / take profit.
name: trades

on:
  workflow_dispatch:

concurrency:
  group: trades
  cancel-in-progress: false

jobs:
  trades:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: trades
    secrets: inherit
