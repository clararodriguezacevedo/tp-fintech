# Manual backup only: the schedule runs in Supabase pg_cron.
# Grade today's recommendations against the close, then issue tomorrow's.
name: after close

on:
  workflow_dispatch:

concurrency:
  group: after-close
  cancel-in-progress: false

jobs:
  after-close:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: after-close
    secrets: inherit
